name: refresh
on:
  schedule: [{cron: "17 */4 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 generate.py && python3 failures.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git config user.name safebump-bot
          git config user.email safebump-bot@users.noreply.github.com
          git add docs && (git diff --cached --quiet || (git commit -m "refresh data" && git push))
